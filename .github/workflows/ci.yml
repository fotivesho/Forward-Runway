name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Database & RLS tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16 >/dev/null
          PATH=/usr/lib/postgresql/16/bin:$PATH npm run test:db
      - run: npm run build
      - name: Browser smoke test
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          (npm start -- -p 3000 &) && npx wait-on http://localhost:3000 --timeout 60000
          BASE_URL=http://localhost:3000 npm run test:e2e
